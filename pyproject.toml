[project]
name = "attest-action"
version = "0.0.6"
description = "A GitHub Action that generates [PEP 740] publish attestations for your Python packages."
readme = "README.md"
dependencies = [
    "prettytable>=3.18.0",
    "pypi-attestations>=0.0.30",
    "sigstore>=4.1.0",
]
requires-python = ">=3.12"
classifiers = [
    # This is a GitHub Action, not a PyPI package.
    "Private :: Do Not Upload",
]

[dependency-groups]
dev = [
    "inline-snapshot>=0.35.3",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "ruff>=0.16.0",
    "ty>=0.0.65",
]


[tool.uv]
no-build = true
require-build-hashes = true
exclude-newer = "P7D"
preview-features = ["build-dependency-hashes"]

[tool.uv.exclude-newer-package]
# Temporarily replace the rolling cutoff for certifi with a fixed
# timestamp to admit 2026.10.19, which removes a root linked to
# compromised intermediate CA keys. Remove the override once the release
# is at least seven days old.
certifi = "2026-10-20T02:24:17Z"

# Temporarily replace the rolling cutoff for sigstore with a fixed
# timestamp to admit 4.5.1, recommended by the Python security team
# after the eMudhra CA key compromise. Remove the override once the
# release is at least seven days old.
sigstore = "2026-10-20T15:12:51Z"
